name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ESP32-C6 firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32c6
          idf.py build

      - name: Collect flashable files
        if: success()
        shell: bash
        run: |
          mkdir -p firmware-artifact
          cp build/bootloader/bootloader.bin firmware-artifact/
          cp build/partition_table/partition-table.bin firmware-artifact/
          cp build/zigbee_casement_window.bin firmware-artifact/
          cp build/flash_args firmware-artifact/ || true
          cp build/flasher_args.json firmware-artifact/ || true
          cp build/project_description.json firmware-artifact/ || true
          cp sdkconfig firmware-artifact/
          printf '%s\n' "Built from commit $GITHUB_SHA" > firmware-artifact/BUILD_INFO.txt

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zigbee-casement-window-${{ github.sha }}
          path: firmware-artifact/
          if-no-files-found: error
          retention-days: 30
