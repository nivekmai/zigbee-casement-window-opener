name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build ESP32-C6 firmware
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32c6
          idf.py build

      - name: Package release files
        shell: bash
        run: |
          OUT="zigbee-casement-window-${GITHUB_REF_NAME}"
          mkdir -p "$OUT"
          cp build/bootloader/bootloader.bin "$OUT/"
          cp build/partition_table/partition-table.bin "$OUT/"
          cp build/zigbee_casement_window.bin "$OUT/"
          cp build/flash_args "$OUT/" || true
          cp build/flasher_args.json "$OUT/" || true
          cp build/project_description.json "$OUT/" || true
          cp sdkconfig "$OUT/"
          cp wiring.svg "$OUT/"
          cp README.md "$OUT/"
          printf '%s\n' "Tag: $GITHUB_REF_NAME" "Commit: $GITHUB_SHA" > "$OUT/BUILD_INFO.txt"
          tar -czf "$OUT.tar.gz" "$OUT"
          zip -r "$OUT.zip" "$OUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            zigbee-casement-window-${{ github.ref_name }}.zip
            zigbee-casement-window-${{ github.ref_name }}.tar.gz
